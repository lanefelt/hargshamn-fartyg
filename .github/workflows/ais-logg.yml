name: AIS-logg

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ais-logg
  cancel-in-progress: false

jobs:
  logg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta AIS och uppdatera loggen
        run: python scripts/logg.py
      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "AIS-logg $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
