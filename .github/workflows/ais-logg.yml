name: AIS-logg

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ais-logg
  cancel-in-progress: false

jobs:
  logg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta AIS och uppdatera loggen
        run: python scripts/logg.py
      - name: Hämta lotsplanen
        continue-on-error: true
        run: python scripts/lots.py
      - name: Spara väder och vattenstånd
        continue-on-error: true
        run: python scripts/vader.py
      - name: Hämta båtlistan
        continue-on-error: true
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: python scripts/plan.py
      - name: Sanktionskontroll
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/sanktion.py
      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "AIS-logg $(date -u +%Y-%m-%dT%H:%MZ)"
            # någon annan kan ha pushat under körningen, hämta och försök igen
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
