<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fartyg i Hargshamn</title>
<style>
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:#1F2933; background:#F4F7FA; }
  .top { background:#fff; text-align:center; padding:10px 0 8px; border-bottom:1px solid #D9E2EC; }
  .top img { height:52px; }
  header { background:linear-gradient(135deg,#0E2A47,#0B1F33 60%,#07131F); color:#fff; padding:14px 18px 16px; }
  header .t1 { font-size:11px; letter-spacing:.18em; color:#2BA8E0; font-weight:bold; text-transform:uppercase; }
  header .t2 { font-size:22px; font-weight:bold; margin-top:2px; }
  main { max-width:640px; margin:40px auto; padding:0 18px; }
  .box { background:#fff; border-left:4px solid #2BA8E0; border-radius:6px; padding:22px 22px 20px; }
  .box h1 { font-size:18px; color:#0B1F33; margin:0 0 8px; }
  .box p { font-size:14px; line-height:1.5; margin:0; color:#52606D; }
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Hargs Hamn"></div>
<header><div class="t1">Hargs Hamn KMA</div><div class="t2">Fartyg i Hargshamn</div></header>
<main>
  <div class="box">
    <h1>Kommer snart</h1>
    <p>Här kommer du att kunna se vilka fartyg som ligger vid kaj, på redden och är på väg till Hargshamn. Funktionen är under uppbyggnad och tas i drift senare.</p>
  </div>
</main>
</body>
</html>
